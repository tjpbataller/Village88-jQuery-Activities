<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is the activity for Form Validation">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="action.js"></script>
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" href="style.css">
    <title>Form Validation</title>
</head>
<body>
    <div>
        <p></p>
        <button id="close">Close</button>
    </div>
    <h1>Scheduling Form for Vaccination</h1>
    <form id="vaccine" action="#">
        <label class="d-inline-block" for="">First Name:
            <input type="text" id="first-name">
        </label>
        <label class="d-inline-block" for="">Last Name:
            <input type="text" id="last-name">
        </label>
        <label for="">Preferred Date:
            <input type="date" id="date">
        </label>
        <input id="submit-btn" type="submit">
    </form>
</body>
</html>
