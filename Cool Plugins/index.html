<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is the activity for Form Validation">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/themes/smoothness/jquery-ui.css">
    <script src='https://code.jquery.com/jquery-3.3.1.slim.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js'></script>
    <script src='https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js'></script>
    <script  src="js/script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.2/css/bootstrap.min.css'>
    <link rel="stylesheet" href="css/style.css">
    <title>Cool Plugins</title>
</head>
<body>
    <header class="ScriptHeader">
        <div class="rt-container">
            <div class="col-rt-12">
                <div class="rt-heading">
                    <h1>Bootstrap 4 Login Modal Example </h1>
                    <p>A login form in Bootstrap 4 modal popup.</p>
                </div>
            </div>
        </div>
    </header>
    <section>
        <div class="rt-container">
            <div class="col-rt-12">
                <div class="Scriptcontent">  
                    <article>
                        <div class="container">
                            <button type="button" class="btn btn-success btn-lg" data-toggle="modal" data-target="#loginModal">Please Click Me! to Popup</button>  
                        </div>
                        <div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered" role="document">
                                <div class="modal-content">
                                    <div class="modal-header border-bottom-0">
                                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="form-title text-center">
                                            <h4>Login</h4>
                                        </div>
                                        <div class="d-flex flex-column text-center">
                                            <form>
                                                <div class="form-group">
                                                    <input type="email" class="form-control" id="email1"placeholder="Your email address...">
                                                </div>
                                                <div class="form-group">
                                                    <input type="password" class="form-control" id="password1" placeholder="Your password...">
                                                </div>
                                                <button type="button" class="btn btn-primary btn-block btn-round">Login</button>
                                            </form>
                                            <div class="text-center text-muted delimiter">or use a social network</div>
                                            <div class="d-flex justify-content-center social-buttons">
                                            <button type="button" class="btn btn-danger" data-toggle="tooltip" data-placement="top" title="Twitter">
                                                <i class="fab fa-youtube"></i>
                                            </button>
                                            <button type="button" class="btn btn-danger" data-toggle="tooltip" data-placement="top" title="Facebook">
                                                <i class="fab fa-instagram"></i>
                                            </button>
                                            <button type="button" class="btn btn-danger" data-toggle="tooltip" data-placement="top" title="Linkedin">
                                                <i class="fab fa-whatsapp"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer d-flex justify-content-center">
                            <div class="signup-section">Not a member yet? <a href="#a" class="text-info"> Sign Up</a>.</div>
                        </div>
                    </div>
                </div>
            </article>       
        </div>
        </div>
    </div>
</section>
</body>
</html>
